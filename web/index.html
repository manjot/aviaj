  <script>
    // Dynamic SEO & Multi-Page History Manager for Aviaj Header Pages
    window.__aviajGetCurrentPath = function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const queryPage = params.get("page");
        if (queryPage) {
          return queryPage.startsWith("/") ? queryPage : "/" + queryPage;
        }
        return window.location.pathname || "/";
      } catch (_) {
        return "/";
      }
    };

    window.__aviajSetMeta = function(selector, attrName, attrVal, contentVal) {
      let el = document.querySelector(selector);
      if (!el) {
        el = document.createElement("meta");
        el.setAttribute(attrName, attrVal);
        document.head.appendChild(el);
      }
      el.setAttribute("content", contentVal);
    };

    window.__aviajApplySeo = function(path, title, description, keywords, canonicalUrl, jsonLd, pushHistory) {
      try {
        document.title = title;
        window.__aviajSetMeta('meta[name="description"]', 'name', 'description', description);
        window.__aviajSetMeta('meta[name="keywords"]', 'name', 'keywords', keywords);
        window.__aviajSetMeta('meta[property="og:title"]', 'property', 'og:title', title);
        window.__aviajSetMeta('meta[property="og:description"]', 'property', 'og:description', description);
        window.__aviajSetMeta('meta[property="og:url"]', 'property', 'og:url', canonicalUrl);
        window.__aviajSetMeta('meta[name="twitter:title"]', 'name', 'twitter:title', title);
        window.__aviajSetMeta('meta[name="twitter:description"]', 'name', 'twitter:description', description);

        let canonicalEl = document.querySelector('link[rel="canonical"]');
        if (!canonicalEl) {
          canonicalEl = document.createElement("link");
          canonicalEl.setAttribute("rel", "canonical");
          document.head.appendChild(canonicalEl);
        }
        canonicalEl.setAttribute("href", canonicalUrl);

        let ldEl = document.getElementById("aviaj-jsonld");
        if (!ldEl) {
          ldEl = document.createElement("script");
          ldEl.id = "aviaj-jsonld";
          ldEl.type = "application/ld+json";
          document.head.appendChild(ldEl);
        }
        ldEl.textContent = jsonLd;

        if (pushHistory && window.location.pathname !== path) {
          window.history.pushState({ path: path }, title, path);
        }
      } catch (_) {}
    };

    window.__aviajGetInitialLang = function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const qLang = params.get("lang") || params.get("hl");
        if (qLang) return qLang.toLowerCase();
        if (window.localStorage) {
          const saved = window.localStorage.getItem("aviaj_lang_v1");
          if (saved) return saved;
        }
      } catch (_) {}
      return "";
    };

    window.__aviajSetLang = function(langCode) {
      try {
        const code = (langCode || "en").toLowerCase();
        document.documentElement.lang = code;
        if (window.localStorage) {
          window.localStorage.setItem("aviaj_lang_v1", code);
        }
      } catch (_) {}
    };

    window.__aviajRegisterPopState = function(callback) {
      window.addEventListener("popstate", function() {
        if (typeof callback === "function") {
          callback(window.__aviajGetCurrentPath());
        }
      });
    };

    // Persistent Privacy Consent Storage (localStorage + 1-year cookie so popup never reappears once accepted)
    window.__aviajHasPrivacyConsent = function() {
      try {
        if (window.localStorage && window.localStorage.getItem("aviaj_privacy_consent_v1") === "1") {
          return true;
        }
        if (document.cookie && document.cookie.indexOf("aviaj_privacy_consent_v1=1") !== -1) {
          return true;
        }
      } catch (_) {}
      return false;
    };

    window.__aviajSetPrivacyConsent = function(accepted) {
      try {
        const val = accepted ? "1" : "0";
        if (window.localStorage) {
          window.localStorage.setItem("aviaj_privacy_consent_v1", val);
        }
        document.cookie = "aviaj_privacy_consent_v1=" + val + "; path=/; max-age=31536000; SameSite=Lax";

    // Live IP & VPN Geolocation Resolver (supports Turbo VPN, browser proxies, and global CDNs)
    window.__aviajDetectedCountry = "";
    window.__aviajFetchCountry = async function() {
      const ts = Date.now();
      const fetchWithTimeout = async (url, extractor) => {
        const ctrl = new AbortController();
        const id = setTimeout(() => ctrl.abort(), 3200);
        try {
          const res = await fetch(url, { cache: "no-store", signal: ctrl.signal });
          clearTimeout(id);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          const code = extractor(data);
          if (code && typeof code === "string" && code.length >= 2) {
            return code.trim().toUpperCase();
          }
          throw new Error("No country code");
        } catch (e) {
          clearTimeout(id);
          throw e;
        }
      };

      try {
        const country = await Promise.any([
          fetchWithTimeout("https://api.country.is/?t=" + ts, d => d && d.country),
          fetchWithTimeout("https://ipwho.is/?t=" + ts, d => d && d.country_code),
          fetchWithTimeout("https://freeipapi.com/api/json?t=" + ts, d => d && d.countryCode),
          fetchWithTimeout("https://ipapi.co/json/?t=" + ts, d => d && d.country_code),
          fetchWithTimeout("/geo.php?t=" + ts, d => d && d.country)
        ]);
        if (country) {
          window.__aviajDetectedCountry = country;
          return country;
        }
      } catch (_) {}
      return window.__aviajDetectedCountry || "";
    };
    // Kick off initial IP geolocation check immediately before Flutter finishes loading
    window.__aviajFetchCountry();
